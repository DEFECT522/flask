{% extends "layout.html" %}
{% block content %}
<div class="container mt-5 text-center">
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card p-4 shadow-sm">
        <h5>إجمالي النقاط</h5>
        <h2>{{ total_points }}</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-4 shadow-sm">
        <h5>نسبة الإنجاز</h5>
        <h2>{{ percentage }}%</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-4 shadow-sm">
        <h5>عدد الأهداف</h5>
        <h2>{{ total_goals }}</h2>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between mt-4">
    <a href="{{ url_for('goals.add_goal') }}" class="btn btn-success">➕ إضافة هدف</a>
    <a href="{{ url_for('goals.all_goals') }}" class="btn btn-primary">📋 عرض الأهداف</a>
  </div>
</div>
{% endblock %}
