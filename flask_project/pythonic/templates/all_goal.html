{% extends "layout.html" %}
{% block content %}
<div class="container mt-5">
  <h2 class="text-center mb-4">كل الأهداف</h2>
  {% for goal in goals %}
  <div class="card mb-3 p-3 shadow-sm">
    <h5>{{ goal.name }}</h5>
    <p>{{ goal.description }}</p>
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <a href="{{ url_for('goals.increase_points', goal_id=goal.id) }}" class="btn btn-success btn-sm">+</a>
        <a href="{{ url_for('goals.decrease_points', goal_id=goal.id) }}" class="btn btn-danger btn-sm">−</a>
      </div>
      <span>النقاط الحالية: <strong>{{ goal.points }}</strong></span>
    </div>
  </div>
  {% else %}
  <p class="text-center">لا توجد أهداف حتى الآن.</p>
  {% endfor %}
</div>
{% endblock %}
